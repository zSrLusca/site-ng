# Nova Garoa — loja em novagaroa.com.br
# VPS: 104.234.63.151
#
# DNS no registrador:
#   A     @      104.234.63.151
#   A     www    104.234.63.151
#
# Depois que o DNS apontar:
#   sudo certbot --nginx -d novagaroa.com.br -d www.novagaroa.com.br

upstream garoa_api {
    server 127.0.0.1:3333;
}

upstream garoa_web {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.novagaroa.com.br;
    return 301 http://novagaroa.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name novagaroa.com.br;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://garoa_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://garoa_api/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://garoa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
