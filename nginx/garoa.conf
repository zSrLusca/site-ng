# Garoa RP — exemplo de virtual host Nginx (VPS + HTTPS)
# Ajuste o server_name e os caminhos dos certificados.

upstream garoa_api {
    server 127.0.0.1:3333;
}

upstream garoa_web {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name loja.garoarp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name loja.garoarp.com;

    ssl_certificate     /etc/ssl/certs/garoa.crt;
    ssl_certificate_key /etc/ssl/private/garoa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://garoa_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://garoa_api/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://garoa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
