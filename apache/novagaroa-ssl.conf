# Inclua este arquivo no httpd-vhosts.conf SÓ DEPOIS do certificado Let's Encrypt.
# Include "C:/Users/Administrator/Desktop/site-ng/apache/novagaroa-ssl.conf"

<VirtualHost *:443>
    ServerName novagaroa.com.br
    ServerAlias www.novagaroa.com.br
    DocumentRoot "C:/xampp/htdocs/novagaroa"

    SSLEngine on
    SSLCertificateFile "C:/Certbot/live/novagaroa.com.br/fullchain.pem"
    SSLCertificateKeyFile "C:/Certbot/live/novagaroa.com.br/privkey.pem"

    <Directory "C:/xampp/htdocs/novagaroa">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /api/ http://127.0.0.1:3333/
    ProxyPassReverse /api/ http://127.0.0.1:3333/
    ProxyPass /uploads/ http://127.0.0.1:3333/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3333/uploads/
</VirtualHost>
