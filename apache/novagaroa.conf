# Nova Garoa — virtual host para XAMPP (Apache)
# VPS Windows: 104.234.63.151  |  domínio: novagaroa.com.br
#
# 1. No httpd.conf do XAMPP, descomente:
#    Include conf/extra/httpd-vhosts.conf
#    LoadModule proxy_module modules/mod_proxy.so
#    LoadModule proxy_http_module modules/mod_proxy_http.so
#    LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#    LoadModule rewrite_module modules/mod_rewrite.so
#    LoadModule headers_module modules/mod_headers.so
#
# 2. No httpd-vhosts.conf, coloque:
#    Include "C:/caminho/do/site-ng/apache/novagaroa.conf"
#    (ou copie este arquivo para C:/xampp/apache/conf/extra/novagaroa.conf e dê Include)
#
# 3. Ajuste DocumentRoot se o clone não estiver neste caminho.
# 4. Reinicie o Apache no painel do XAMPP.
# 5. A API Node precisa estar rodando em 127.0.0.1:3333.

<VirtualHost *:80>
    ServerName www.novagaroa.com.br
    Redirect permanent / http://novagaroa.com.br/
</VirtualHost>

<VirtualHost *:80>
    ServerName novagaroa.com.br
    DocumentRoot "C:/xampp/htdocs/novagaroa"

    <Directory "C:/xampp/htdocs/novagaroa">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /api/ http://127.0.0.1:3333/
    ProxyPassReverse /api/ http://127.0.0.1:3333/

    ProxyPass /uploads/ http://127.0.0.1:3333/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3333/uploads/

    ErrorLog "logs/novagaroa-error.log"
    CustomLog "logs/novagaroa-access.log" common
</VirtualHost>
