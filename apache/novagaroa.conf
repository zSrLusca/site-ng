# Nova Garoa — XAMPP
# O primeiro VirtualHost é o padrão (127.0.0.1 e o IP da VPS).

<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1 104.234.63.151
    DocumentRoot "C:/xampp/htdocs/novagaroa"

    <Directory "C:/xampp/htdocs/novagaroa">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /api/ http://127.0.0.1:3333/
    ProxyPassReverse /api/ http://127.0.0.1:3333/

    ProxyPass /uploads/ http://127.0.0.1:3333/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3333/uploads/

    ErrorLog "logs/novagaroa-error.log"
    CustomLog "logs/novagaroa-access.log" common
</VirtualHost>

<VirtualHost *:80>
    ServerName novagaroa.com.br
    ServerAlias www.novagaroa.com.br
    DocumentRoot "C:/xampp/htdocs/novagaroa"

    Alias /.well-known/acme-challenge/ "C:/xampp/htdocs/novagaroa/.well-known/acme-challenge/"

    <Directory "C:/xampp/htdocs/novagaroa">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /api/ http://127.0.0.1:3333/
    ProxyPassReverse /api/ http://127.0.0.1:3333/

    ProxyPass /uploads/ http://127.0.0.1:3333/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3333/uploads/
</VirtualHost>
