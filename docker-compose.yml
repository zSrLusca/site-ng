services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garoa-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PAYMENT_DEV_MODE: "false"
      PAYMENT_PROVIDER: mercadopago
      DATABASE_URL: file:./dev.db
    ports:
      - "3333:3333"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/prisma:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://novagaroa.com.br/api}
    container_name: garoa-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
